# Orquestração local do Classificador de Assuntos PGE-SP.
#
# Uso:
#   1. Garanta que o modelo padrão (v2) está em
#      backend/model/artifacts/model.joblib e, se quiser o modelo v1 no
#      seletor, que o dele está em backend/model/artifacts_xgb_v1/model.joblib.
#      Ambos saem das Releases:
#        uv run python -m model.download_model --modelo todos
#      Faltando o artefato do v1, ele apenas não aparece no seletor.
#   2. docker compose up --build
#   3. Acesse http://localhost:8080
#
# As portas do host são configuráveis, para o caso de já haver algo ouvindo
# nelas na máquina de quem instala:
#   FRONTEND_PORT=8081 BACKEND_PORT=8001 docker compose up
services:
  backend:
    build:
      context: ./backend
    image: classificador-app-backend
    environment:
      APP_MODEL_PATH: /app/model/artifacts/model.joblib
      APP_LEGACY_MODEL_PATH: /app/model/artifacts_xgb_v1/model.joblib
      APP_DEFAULT_THRESHOLD: ${APP_DEFAULT_THRESHOLD:-0.5}
      APP_OCR_ENABLED: ${APP_OCR_ENABLED:-true}
      APP_OCR_LANGUAGE: ${APP_OCR_LANGUAGE:-por}
      # O frontend fala com a API pelo proxy do próprio nginx (mesma origem);
      # estas origens cobrem quem acessa a API direto, em dev.
      APP_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}","http://localhost:5173"]'
    volumes:
      # Permite trocar os modelos sem rebuild da imagem.
      - ./backend/model/artifacts:/app/model/artifacts:ro
      - ./backend/model/artifacts_xgb_v1:/app/model/artifacts_xgb_v1:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: classificador-app-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
