[project]
name = "classificador-app-backend"
version = "0.2.0"
description = "Backend FastAPI do classificador de assuntos jurídicos da PGE-SP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.46",
    "numba>=0.60",
    "llvmlite>=0.43",
    "joblib>=1.3",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "unidecode>=1.3",
    "openpyxl>=3.1",
]

[dependency-groups]
train = [
    "pandas>=2.2",
    "pyarrow>=15.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
